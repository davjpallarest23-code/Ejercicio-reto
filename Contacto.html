<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="FondoContacto">
    <header class="encabezado">
        <div class="contenedorNav">
            <a href="index.html"><div class="logo">GameZone</div></a>
            <nav class="navegacion">
                <a href="index.html">Inicio</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
        <div class="contenedorTitulo">
            <h1>GameZone</h1>
        </div>        
    </header>

    <div class="contenedorContacto">
        <div class="tituloContacto">
            <h2>Contacto</h2>
            <hr>
        </div>
        <div class="contenedorFormularioContacto">
            <form class="formulario" method="post">
                <label class="detallesLetra" for="nombre">Nombre:</label>
                <input type="text" name="" id="nombre">
                <label class="detallesLetra" for="apellido">Apellido:</label>
                <input type="text" name="" id="apellido">
                <label class="detallesLetra" for="telefono">Telefono:</label>
                <input type="tel" name="" id="telefono">
                <label class="detallesLetra" for="correo">Correo:</label>
                <input type="email" name="" id="correo">
                <label class="detallesLetra" for="mensaje">Mensaje:</label>
                <textarea name="" id="mensaje" >
                </textarea>
                <div class="ContenedorBotones">
                    <button class="btn btnEnviar" type="submit">Enviar</button>
                    <button class="btn btnResetear" type="reset">Resetear</button>
                </div>
            </form>
        </div>
    </div>

    <div class="footer">
        <h2>Creado por: David Pallares</h2>
    </div>
    </div>
</body>
</html>
